{% extends 'core/base.html' %}
{% block title %}Add Lead{% endblock %}
{% block content %}
<div class="py-6 px-6">
    <h1> Leads</h1>
    <a href="{% url 'add_lead' %}" class="inline-block py-4 px-6 bg-cyan-600 rounded-xl text-white">Add Leads</a>
    <div class="py-4 flex justify-between">
        <p class="py-4 px-2 bg-gray-200 font-semibold w-full "> Name </p>
        <p class="py-4 px-2 bg-gray-200 font-semibold w-full"> Choices </p>
        <p class="py-4 px-2 bg-gray-200 font-semibold w-full"> Status </p>

    </div>
    {% for lead in leads %}
       <div class="py-4 flex justify-between">
           <p class="py-2 px-2 w-full {% cycle 'bg-gray-100' '' %}">{{ lead.name }}</p>
           <p class="py-2 px-2 w-full {% cycle 'bg-gray-100' '' %}">{{ lead.get_choice_status_display }}</p>
           <p class="py-2 px-2 w-full {% cycle 'bg-gray-100' '' %} ">{{ lead.get_priority_display }}</p>
       </div>
    {% endfor %}
    

</div>
{% endblock %}
