<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>{% block title %}{% endblock %}</title>
  </head>

  <body>
      <nav class="py-6 px-6 flex  justify-between bg-cyan-500">
          <a href="/" class="text-white">Lead Forge</a>
          <div class="space-x-4">
              <a href="{% url 'about' %}" class= "text-white">About</a>
              {% if request.user.is_authenticated %}
                <form method="POST" action="{% url 'logout' %}" class="inline">
                {% csrf_token %}
                <button type="submit" class="py-4 px-6 bg-red-300 rounded-xl text-white cursor-pointer">
                  Logout
                </button>
                <a href="{% url 'dashboard' %}" class="py-4 px-6 bg-cyan-600 rounded-xl text-white">Dashboard</a>
                </form>
              {% else %}
                <a href="{% url 'login' %}" class="py-4 px-6 bg-cyan-600 rounded-xl text-white">Login</a>
                <a href="{% url 'signup' %}" class="py-4 px-6 bg-cyan-300 rounded-xl text-white">Signup</a>
              {% endif %}
               
          </div>
      </nav>
      {% block content %}
      {% endblock %}
      <footer class="py-8 text-center bg-gray-300" >
         <p class="text-xs text-gray-700"> Copyright (c) 2025-LeadForge </p>
      </footer>
  </body>
</html>
